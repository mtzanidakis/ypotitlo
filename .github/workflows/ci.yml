name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot commits carry long release-note bodies that trip
    # body-max-line-length; its messages are machine-generated, so skip them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional
      # On the very first push to a branch github.event.before is all zeros,
      # which commitlint cannot resolve; fall back to the single head commit.
      - run: |
          from="${{ github.event.pull_request.base.sha || github.event.before }}"
          to="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "${to}~1" --to "$to" --verbose
          else
            npx commitlint --from "$from" --to "$to" --verbose
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          experimental: true
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          experimental: true
      - run: go mod verify
      - run: go vet ./...
      - run: gofmt -l $(go list -f '{{.Dir}}' ./...) | tee gofmt.out && test ! -s gofmt.out
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      # Guards the testability seams: no package may read the real home dir.
      # The task preserves GOCACHE/GOMODCACHE, which otherwise live under $HOME.
      - run: mise run test-nohome
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          experimental: true
      - run: mise run build
